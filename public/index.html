        // ========== 아파트 차트 렌더링 ==========
        async function renderAptChart() {
            const chartContainer = document.getElementById('aptChart');
            
            // 기존 차트 인스턴스 제거
            if (state.apt.chartInstance) {
                state.apt.chartInstance.destroy();
                state.apt.chartInstance = null;
            }
            
            // 선택된 아파트가 없으면 플레이스홀더 표시
            if (state.apt.selectedApt === '선택하세요') {
                chartContainer.innerHTML = '<div class="chart-placeholder">아파트를 선택하세요</div>';
                chartContainer.style.background = 'linear-gradient(135deg, #1976d2 0%, #42a5f5 50%)';
                return;
            }
            
            console.log('📊 차트 렌더링 시작');
            
            // 차트 컨테이너 초기화
            chartContainer.innerHTML = '';
            chartContainer.style.background = 'white';
            
            // 년월 범위 생성
            const [startIdx, endIdx] = state.apt.yearRange;
            const startYear = SLIDER_START_YEAR + Math.floor(startIdx / 12);
            const startMonth = (startIdx % 12) + 1;
            const endYear = SLIDER_START_YEAR + Math.floor(endIdx / 12);
            const endMonth = (endIdx % 12) + 1;
            
            const categories = [];
            let currentYear = startYear;
            let currentMonth = startMonth;
                       

            while (currentYear < endYear || (currentYear === endYear && currentMonth <= endMonth)) {
                const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-01`;
                categories.push(dateStr);
                currentMonth++;
                if (currentMonth > 12) {
                    currentMonth = 1;
                    currentYear++;
                }
            }

            // 시리즈 데이터 생성
            const series = [];
            
            // 매물호가 - RangeArea (최저/최고)
            const rangeData = [];
            if (state.apt.visibleSeries.매물호가) {
                const basePrice = 20000000; // 2억
                categories.forEach((date, i) => {
                    // 80% 확률로 호가 존재
                    if (Math.random() < 0.8) {
                        const minPrice = Math.floor(basePrice + Math.sin(i / 6) * 5000000 + Math.random() * 2000000);
                        const maxPrice = Math.floor(minPrice + 10000000 + Math.random() * 5000000);
                        rangeData.push({
                            x: date,
                            y: [minPrice, maxPrice]
                        });
                    } else {
                        rangeData.push({
                            x: date,
                            y: null  // 호가 없음
                        });
                    }
                });
                
                series.push({
                    name: '매물호가',
                    type: 'rangeArea',
                    data: rangeData
                });
            }
            
            // 매물량 - Column 차트
            if (state.apt.visibleSeries.매물량) {
                const columnData = categories.map((date, i) => {
                    const baseCount = 200;
                    const trend = Math.sin(i / 8) * 80;
                    const random = Math.random() * 40 - 20;
                    const spike = (i % 15 === 0) ? Math.random() * 150 : 0;
                    return {
                        x: date,
                        y: Math.floor(Math.max(50, baseCount + trend + random + spike))
                    };
                });
                
                series.push({
                    name: '매물량',
                    type: 'column',
                    data: columnData
                });
            }
            
            // 실거래가 - Scatter (날짜별로 여러 거래)
            if (state.apt.visibleSeries.실거래가) {
                const tradeData = [];
                const basePrice = 25000000; // 2.5억
                
                categories.forEach((date, i) => {
                    // 70% 확률로 거래 발생
                    if (Math.random() < 0.7) {
                        // 1~3건의 거래 생성 (같은 날짜에 여러 건)
                        const tradeCount = Math.floor(Math.random() * 3) + 1;
                        
                        for (let j = 0; j < tradeCount; j++) {
                            const price = Math.floor(basePrice + Math.sin(i / 6) * 8000000 + Math.random() * 10000000);
                            tradeData.push({
                                x: date,  // ✅ 같은 날짜 (동일한 x값)
                                y: price  // ✅ 다른 가격
                            });
                        }
                    }
                });
                
                console.log('실거래가 데이터 샘플:', tradeData.slice(0, 10));
                console.log('총 거래 건수:', tradeData.length);
                
                series.push({
                    name: '실거래가',
                    type: 'scatter',
                    data: tradeData
                });
            }
            
            // 심리분석 - Candlestick (시가, 고가, 저가, 종가)
            if (state.apt.visibleSeries.심리분석) {
                const basePrice = 30000000; // 3억 기준
                const candleData = categories.map((date, i) => {
                    // 시가 (open)
                    const open = basePrice + Math.sin(i / 5) * 8000000 + Math.random() * 3000000;
                    
                    // 종가 (close) - 시가 기준 ±10% 변동
                    const closeChange = (Math.random() - 0.5) * 2 * 0.1; // -10% ~ +10%
                    const close = open * (1 + closeChange);
                    
                    // 고가 (high) - 시가와 종가 중 높은 값 기준
                    const maxPrice = Math.max(open, close);
                    const high = maxPrice + Math.random() * 5000000;
                    
                    // 저가 (low) - 시가와 종가 중 낮은 값 기준
                    const minPrice = Math.min(open, close);
                    const low = minPrice - Math.random() * 5000000;
                    
                    return {
                        x: date,
                        y: [
                            Math.floor(open),   // 시가
                            Math.floor(high),   // 고가
                            Math.floor(low),    // 저가
                            Math.floor(close)   // 종가
                        ]
                    };
                });
                
                series.push({
                    name: '심리분석',
                    type: 'candlestick',
                    data: candleData
                });
            }
            
            if (series.length === 0) {
                chartContainer.innerHTML = '<div class="chart-placeholder">한국부동산원 AI 분석 플랫폼</div>';
                chartContainer.style.background = 'linear-gradient(135deg, #1976d2 0%, #42a5f5 50%)';
                return;
            }
            
            // 색상 설정
            const colors = {
                '매물호가': '#ef5350',
                '매물량': '#42a5f5',
                '실거래가': '#66bb6a',
                '심리분석': '#ff9800'
            };

            // Y축 설정
            const yaxis = series.map((s, idx) => {
                const seriesName = s.name;
                const isPriceOrTrade = (seriesName === '매물호가' || seriesName === '실거래가' || seriesName === '심리분석');
                const isCount = (seriesName === '매물량');
                
                if (isPriceOrTrade) {
                    const isFirstPriceOrTrade = series.findIndex(ser =>
                        ser.name === '매물호가' || ser.name === '실거래가' || ser.name === '심리분석'
                    ) === idx;
                    
                    return {
                        seriesName: seriesName,
                        axisTicks: { show: isFirstPriceOrTrade },
                        axisBorder: { 
                            show: isFirstPriceOrTrade, 
                            color: '#f44336'
                        },
                        labels: {
                            show: isFirstPriceOrTrade,
                            style: { colors: '#f44336' },
                            formatter: val => val ? (val / 10000).toFixed(0) + '만' : ''
                        },
                        title: {
                            text: isFirstPriceOrTrade ? '금액 (만원)' : undefined,
                            style: { 
                                color: '#f44336',
                                fontWeight: 600
                            }
                        },
                        opposite: false,
                        min: 15000000,
                        max: 45000000
                    };
                } else if (isCount) {
                    return {
                        seriesName: seriesName,
                        axisTicks: { show: true },
                        axisBorder: { 
                            show: true, 
                            color: '#2196f3'
                        },
                        labels: {
                            style: { colors: '#2196f3' },
                            formatter: val => val ? Math.floor(val) + '건' : ''
                        },
                        title: {
                            text: '매물량 (건수)',
                            style: { 
                                color: '#2196f3',
                                fontWeight: 600
                            }
                        },
                        opposite: true,
                        min: 0,
                        max: 500
                    };
                } else {
                    return {
                        seriesName: seriesName,
                        show: false
                    };
                }
            });

            // 정책 annotations
            const annotations = {
                xaxis: state.apt.checkedPolicies.map(policy => {
                    const dateStr = policy.date;
                    const policyDate = `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-01`;
                    const originalDate = formatDate(dateStr);
                    
                    return {
                        x: policyDate,
                        strokeDashArray: 0,
                        borderColor: '#757575',
                        borderWidth: 2,
                        label: {
                            borderColor: '#757575',
                            style: {
                                color: '#fff',
                                background: '#757575',
                                fontSize: '10px',
                                fontWeight: 600,
                                padding: { left: 6, right: 6, top: 3, bottom: 3 }
                            },
                            orientation: 'horizontal',
                            textAnchor: 'middle',
                            text: `${originalDate} ${policy.title.substring(0, 20)}`,
                            offsetY: -10
                        }
                    };
                })
            };
            
            const seriesColors = series.map(s => colors[s.name]);

            // 기본 ApexCharts 스타일 tooltip
            const tooltipConfig = {
                enabled: true,
                shared: true,
                intersect: false,
                followCursor: false,
                offsetY: -50, // 툴팁을 위로 50px 이동
                x: {
                    format: 'yyyy-MM-dd'
                },
                custom: function({ series, seriesIndex, dataPointIndex, w }) {
                    let dateValue = null;
                    
                    // 현재 시리즈가 scatter인지 확인하고, scatter면 실제 데이터의 x값 사용 
                    //scatter 시리즈는 중복 x값을 허용하기 때문에 categories 배열의 인덱스와 실제 데이터의 위치가 다를 수 있음
                    if (w && w.config && w.config.series) {
                    const currentSeries = w.config.series[seriesIndex];
                    if (currentSeries && currentSeries.type === 'scatter') {
                        const seriesDataRaw = currentSeries.data || [];
                        if (seriesDataRaw[dataPointIndex] && typeof seriesDataRaw[dataPointIndex].x !== 'undefined') {
                        dateValue = seriesDataRaw[dataPointIndex].x;
                        }
                    } else {
                        dateValue = categories[dataPointIndex];
                    }
                    }
                    
                    // 타입별 html 생성 함수
                    function renderCandlestick(s, idx, seriesColor, seriesName, seriesDataRaw) {
                    const dataPoint = seriesDataRaw[dataPointIndex];
                    if (dataPoint && Array.isArray(dataPoint.y) && dataPoint.y.length === 4) {
                        const [open, high, low, close] = dataPoint.y;
                        return `
                        <div class="apexcharts-tooltip-series-group apexcharts-active" style="order: ${idx + 1}; display: flex;">
                            <span class="apexcharts-tooltip-marker" style="background-color: ${seriesColor};"></span>
                            <div class="apexcharts-tooltip-text" style="font-family: Helvetica, Arial, sans-serif; font-size: 12px;">
                            <div class="apexcharts-tooltip-y-group">
                                <span class="apexcharts-tooltip-text-y-label">${seriesName}</span><br>
                                <span class="apexcharts-tooltip-text-y-label">시가: </span><span class="apexcharts-tooltip-text-y-value">${open !== null && open !== undefined ? Number(open).toLocaleString() : '-'}</span><br>
                                <span class="apexcharts-tooltip-text-y-label">고가: </span><span class="apexcharts-tooltip-text-y-value">${high !== null && high !== undefined ? Number(high).toLocaleString() : '-'}</span><br>
                                <span class="apexcharts-tooltip-text-y-label">저가: </span><span class="apexcharts-tooltip-text-y-value">${low !== null && low !== undefined ? Number(low).toLocaleString() : '-'}</span><br>
                                <span class="apexcharts-tooltip-text-y-label">종가: </span><span class="apexcharts-tooltip-text-y-value">${close !== null && close !== undefined ? Number(close).toLocaleString() : '-'}</span>
                            </div>
                            </div>
                        </div>
                        `;
                    }
                    return '';
                    }

                    function renderScatter(s, idx, seriesColor, seriesName, seriesDataRaw) {
                    // dateValue를 기준으로 동일 날짜 데이터 찾기
                    let sameDateItems = [];
                    if (dateValue !== null && typeof dateValue !== 'undefined') {
                        sameDateItems = seriesDataRaw.filter(item => {
                        if (!item || typeof item.x === 'undefined') return false;
                        // 날짜 타입이 다를 수 있으니 문자열로 변환해서 비교
                        return String(item.x) === String(dateValue);
                        });
                    }

                    let innerHtml = '';
                    if (sameDateItems.length === 0) {
                        innerHtml = `<span class="apexcharts-tooltip-text-y-label">${seriesName}: </span><span class="apexcharts-tooltip-text-y-value">없음</span>`;
                    } else if (sameDateItems.length === 1) {
                        innerHtml = `<span class="apexcharts-tooltip-text-y-label">${seriesName}: </span><span class="apexcharts-tooltip-text-y-value">${Number(sameDateItems[0].y).toLocaleString()}</span>`;
                    } else if (sameDateItems.length === 2) {
                        innerHtml = `<span class="apexcharts-tooltip-text-y-label">${seriesName}: </span>` +
                        sameDateItems.map(item => `<span class=\"apexcharts-tooltip-text-y-value\" style=\"margin-right: 8px;\">${Number(item.y).toLocaleString()}</span>`).join('');
                    } else {
                        innerHtml = `<span class="apexcharts-tooltip-text-y-label" style="margin-bottom: 4px; display: block;">${seriesName}: </span>`;
                        const itemsPerRow = 3;
                        for (let i = 0; i < sameDateItems.length; i += itemsPerRow) {
                        const rowItems = sameDateItems.slice(i, i + itemsPerRow);
                        innerHtml += '<div style="margin-bottom: 2px;">' +
                            rowItems.map(item => `<span class=\"apexcharts-tooltip-text-y-value\" style=\"margin-right: 8px;\">${Number(item.y).toLocaleString()}</span>`).join('') +
                            '</div>';
                        }
                    }
                    return `
                        <div class="apexcharts-tooltip-series-group apexcharts-active" style="order: ${idx + 1}; display: flex;">
                        <span class="apexcharts-tooltip-marker" style="background-color: ${seriesColor};"></span>
                        <div class="apexcharts-tooltip-text" style="font-family: Helvetica, Arial, sans-serif; font-size: 12px; max-width: 350px;">
                            <div class="apexcharts-tooltip-y-group">${innerHtml}</div>
                        </div>
                        </div>
                    `;
                    }

                    function renderRangeArea(s, idx, seriesColor, seriesName, seriesDataRaw) {
                    const dataPoint = seriesDataRaw[dataPointIndex];
                    let displayValue = '없음';
                    if (dataPoint && Array.isArray(dataPoint.y) && dataPoint.y.length === 2) {
                        const [min, max] = dataPoint.y;
                        if (min !== null && min !== undefined && max !== null && max !== undefined) {
                        displayValue = `${Number(min).toLocaleString()} ~ ${Number(max).toLocaleString()}`;
                        }
                    }
                    return `
                        <div class="apexcharts-tooltip-series-group apexcharts-active" style="order: ${idx + 1}; display: flex;">
                        <span class="apexcharts-tooltip-marker" style="background-color: ${seriesColor};"></span>
                        <div class="apexcharts-tooltip-text" style="font-family: Helvetica, Arial, sans-serif; font-size: 12px;">
                            <div class="apexcharts-tooltip-y-group">
                            <span class="apexcharts-tooltip-text-y-label">${seriesName}: </span>
                            <span class="apexcharts-tooltip-text-y-value">${displayValue}</span>
                            </div>
                        </div>
                        </div>
                    `;
                    }

                    function renderDefault(s, idx, seriesColor, seriesName, seriesDataRaw) {
                    const dataPoint = seriesDataRaw[dataPointIndex];
                    let displayValue = '없음';
                    if (dataPoint && typeof dataPoint.y !== 'undefined' && dataPoint.y !== null) {
                        if (dataPoint.y === 0) {
                        displayValue = '0';
                        } else {
                        displayValue = Number(dataPoint.y).toLocaleString();
                        }
                    }
                    return `
                        <div class="apexcharts-tooltip-series-group apexcharts-active" style="order: ${idx + 1}; display: flex;">
                        <span class="apexcharts-tooltip-marker" style="background-color: ${seriesColor};"></span>
                        <div class="apexcharts-tooltip-text" style="font-family: Helvetica, Arial, sans-serif; font-size: 12px;">
                            <div class="apexcharts-tooltip-y-group">
                            <span class="apexcharts-tooltip-text-y-label">${seriesName}: </span>
                            <span class="apexcharts-tooltip-text-y-value">${displayValue}</span>
                            </div>
                        </div>
                        </div>
                    `;
                    }

                    // 시리즈별로 타입에 따라 html 생성
                    const seriesHtmlArr = w.config.series.map((s, idx) => {
                    const seriesType = s.type || 'line';
                    const seriesName = s.name || '';
                    const seriesColor = w.config.colors[idx] || '#000';
                    const seriesDataRaw = s.data || [];
                    if (seriesType === 'candlestick') {
                        return renderCandlestick(s, idx, seriesColor, seriesName, seriesDataRaw);
                    } else if (seriesType === 'scatter') {
                        return renderScatter(s, idx, seriesColor, seriesName, seriesDataRaw);
                    } else if (seriesType === 'rangeArea') {
                        return renderRangeArea(s, idx, seriesColor, seriesName, seriesDataRaw);
                    } else {
                        return renderDefault(s, idx, seriesColor, seriesName, seriesDataRaw);
                    }
                    });

                    return `<div class="apexcharts-tooltip-title" style="font-family: Helvetica, Arial, sans-serif; font-size: 12px;">${dateValue}</div>` + seriesHtmlArr.join('');
                }
            };

            // 아파트 정보 차트 옵션
            const options = {
                series: series,
                chart: {
                    type: 'line',
                    height: 400,
                    stacked: false,
                    toolbar: {
                        show: true,
                        tools: {
                            download: true,
                            zoom: true,
                            zoomin: true,
                            zoomout: true,
                            pan: true,
                            reset: true
                        }
                    },
                    animations: {
                        enabled: true,
                        easing: 'easeinout',
                        speed: 800
                    }
                },
                colors: seriesColors,
                stroke: {
                    curve: 'smooth',
                    //curve: series.map(s => s.type === 'rangeArea' ? 'smooth' : 'straight'),
                    width: series.map(s => {
                        if (s.type === 'rangeArea') return 1;
                        if (s.type === 'column') return 1;
                        if (s.type === 'scatter') return 0;
                        return 3;
                    })
                },
                fill: {
                    type: series.map(s => {
                        if (s.type === 'rangeArea') return 'gradient';
                        if (s.type === 'column') return 'solid';
                        return 'solid';
                    }),
                    opacity: series.map(s => {
                        if (s.type === 'rangeArea') return 0.6;
                        if (s.type === 'column') return 0.85;
                        return 1;
                    }),
                    gradient: {
                        shade: 'light',
                        type: 'vertical',
                        shadeIntensity: 0.4,
                        gradientToColors: undefined,
                        inverseColors: true,
                        opacityFrom: 0.85,
                        opacityTo: 0.3,
                        stops: [0, 100]
                    }
                },
                markers: {
                    size: series.map(s => {
                        if (s.type === 'scatter') return 5;
                        return 0;
                    }),
                    colors: series.map(s => {
                        if (s.type === 'scatter') return '#4caf50';
                        return undefined;
                    }),
                    strokeColors: '#fff',
                    strokeWidth: 2,
                    hover: {
                        size: series.map(s => {
                            if (s.type === 'scatter') return 7;
                            return 0;
                        })
                    }
                },
                plotOptions: {
                    bar: {
                        columnWidth: '50%',
                        borderRadius: 2
                    },
                    candlestick: {
                        colors: {
                            upward: '#ef5350',    // 상승 (빨강)
                            downward: '#26a69a'   // 하락 (초록)
                        },
                        wick: {
                            useFillColor: true
                        }
                    }
                },
                dataLabels: {
                    enabled: false
                },
                xaxis: {
                    type: 'category',
                    categories: categories,
                    labels: {
                        rotate: -45,
                        rotateAlways: true,
                        style: {
                            fontSize: '11px'
                        }
                    },
                    tickAmount: Math.min(12, Math.floor(categories.length / 6))
                },
                yaxis: yaxis,
                legend: {
                    position: 'bottom',
                    horizontalAlign: 'center',
                    fontSize: '12px',
                    markers: {
                        width: 10,
                        height: 10,
                        radius: 2
                    },
                    itemMargin: {
                        horizontal: 10,
                        vertical: 5
                    }
                },
                tooltip: tooltipConfig,
                grid: {
                    borderColor: '#e0e0e0',
                    strokeDashArray: 4,
                    xaxis: {
                        lines: {
                            show: true
                        }
                    },
                    yaxis: {
                        lines: {
                            show: true
                        }
                    }
                },
                annotations: annotations,
                title: {
                    text: `${state.apt.selectedApt} - ${state.apt.selectedSaleType} ${state.apt.selectedArea}㎡`,
                    align: 'left',
                    style: {
                        fontSize: '16px',
                        fontWeight: 600,
                        color: '#1976d2'
                    }
                }
            };

            try {
                const chart = new ApexCharts(chartContainer, options);
                await chart.render();
                
                state.apt.chartInstance = chart;
                
                console.log('✅ 아파트 차트 렌더링 완료');
                
            } catch (err) {
                console.error('❌ 아파트 차트 렌더링 실패:', err);
                chartContainer.innerHTML = `<div style="color: red; padding: 40px; text-align: center;">차트 생성 실패<br/>${err.message}</div>`;
            }
        }

        async function analyzeAptChart() {
            if (state.apt.selectedApt === '선택하세요') {
                alert('아파트를 선택하세요.');
                return;
            }
            
            if (!state.apt.chartInstance) {
                alert('차트를 먼저 생성해주세요.');
                return;
            }
            
            try { 
                // ApexCharts의 dataURI() 메서드로 이미지 추출
                const imgDataURI = await state.apt.chartInstance.dataURI();
                
                if (!imgDataURI || !imgDataURI.imgURI) {
                    console.error('❌ 이미지 추출 실패');
                    alert('이미지 생성에 실패했습니다.');
                    return;
                }
                
                const uri = imgDataURI.imgURI;
                const ext = 'png';
                const uuid = typeof uuidv4 === 'function' ? uuidv4() : Date.now().toString();
                const date = new Date().toISOString();
                const chartId = `${state.apt.selectedApt}_${state.apt.selectedSaleType}_${state.apt.selectedArea}`;
                
                // 히스토리에 추가
                const newImage = {
                    uri: uri,
                    ext: ext,
                    date: date,
                    chartId: chartId,
                    uuid: uuid
                };
                
                state.chartImageHistory.unshift(newImage);             
                
                // 히스토리 렌더링 (양쪽 모두 업데이트)
                renderHistory();
                
                // 히스토리 탭으로 자동 전환
                switchAptTab(0);
                
            } catch (err) {
                console.error('❌ 이미지 추출 실패:', err);
                alert('이미지 생성 중 오류가 발생했습니다.');
            }
        }


        // ========== 지도 관련 함수 ==========
        
        // 인증 실패 처리

        // 지도 초기화
        function initMap() {
            console.log('🗺️ 지도 초기화');
            
            // 이미 초기화된 경우 스킵
            if (state.map.instance) {
                console.log('✅ 지도 이미 초기화됨');
                return;
            }
            
            if (!window.naver || !window.naver.maps) {
                console.error('❌ Naver Maps API가 로드되지 않았습니다.');
                const mapDiv = document.getElementById('map');
                if (mapDiv) {
                    mapDiv.innerHTML = '<div class="error">지도 API 로드에 실패했습니다. CLIENT_ID를 확인하세요.</div>';
                }
                return;
            }
            
            try {
                // 지도 옵션
                const mapOptions = {
                    center: new naver.maps.LatLng(37.5665, 126.9780), // 서울 시청 좌표
                    zoom: 10
                };
                
                // 지도 생성
                state.map.instance = new naver.maps.Map('map', mapOptions);
                
                console.log('✅ 지도 초기화 완료 - 중심:', mapOptions.center.toString());
                
                // 서울시청 위치에 기본 마커 표시
                state.map.currentMarker = new naver.maps.Marker({
                    position: mapOptions.center,
                    map: state.map.instance,
                    title: '서울시청'
                });
                
                // 검색 버튼 이벤트
                const searchButton = document.getElementById('mapSearchButton');
                if (searchButton) {
                    searchButton.onclick = handleMapSearch;
                }
                
                // Enter 키 이벤트
                const searchInput = document.getElementById('mapAddressInput');
                if (searchInput) {
                    searchInput.onkeypress = function(e) {
                        if (e.key === 'Enter') {
                            handleMapSearch();
                        }
                    };
                }
                
            } catch (error) {
                console.error('❌ 지도 초기화 실패:', error);
                const mapDiv = document.getElementById('map');
                if (mapDiv) {
                    mapDiv.innerHTML = '<div class="error">지도 초기화에 실패했습니다.</div>';
                }
            }
        }
        
        // 주소 검색
        function handleMapSearch() {
            const addressInput = document.getElementById('mapAddressInput');
            if (!addressInput) {
                console.error('❌ 주소 입력창을 찾을 수 없습니다.');
                return;
            }
            
            const address = addressInput.value;
            searchAddressToCoordinate(address);
        }
        
        function searchAddressToCoordinate(searchAddress) {
            if (!state.map.instance) {
                console.error('❌ 지도가 초기화되지 않았습니다.');
                alert('지도를 초기화하는 중입니다. 잠시 후 다시 시도해주세요.');
                return;
            }
            
            if (!searchAddress || !searchAddress.trim()) {
                alert('주소를 입력해주세요.');
                return;
            }
            
            console.log('🔍 주소 검색:', searchAddress);
            
            // Geocoding API 사용
            naver.maps.Service.geocode({
                query: searchAddress
            }, function(status, response) {
                if (status !== naver.maps.Service.Status.OK) {
                    console.error('❌ 주소 검색 실패:', searchAddress, status);
                    alert('주소를 찾을 수 없습니다. 정확한 주소를 입력해주세요.');
                    return;
                }
                
                if (response.v2.meta.totalCount === 0) {
                    alert('검색 결과가 없습니다.');
                    return;
                }
                
                const item = response.v2.addresses[0];
                const point = new naver.maps.LatLng(item.y, item.x);
                
                console.log('✅ 주소 검색 성공:', searchAddress);
                console.log('   좌표:', item.y, item.x);
                console.log('   도로명:', item.roadAddress);
                console.log('   지번:', item.jibunAddress);
                
                // 지도 중심 이동
                state.map.instance.setCenter(point);
                state.map.instance.setZoom(16);
                
                // 기존 마커 제거
                if (state.map.currentMarker) {
                    state.map.currentMarker.setMap(null);
                }
                
                // 새 마커 추가
                try {
                    state.map.currentMarker = new naver.maps.Marker({
                        position: point,
                        map: state.map.instance,
                        title: item.roadAddress || item.jibunAddress
                    });
                    
                    console.log('✅ 마커 생성 완료');
                    
                } catch (error) {
                    console.error('❌ 마커 생성 실패:', error);
                }
            });
        }

        // ========== 초기화 ==========
        function init() {
            console.log('🚀 앱 초기화');
            
            // ApexCharts 로드 확인
            if (typeof ApexCharts === 'undefined') {
                console.error('❌ ApexCharts 라이브러리가 로드되지 않았습니다');
                alert('차트 라이브러리 로딩에 실패했습니다. 페이지를 새로고침 해주세요.');
            } else {
                console.log('✅ ApexCharts 로드 완료');
            }
            
            // 슬라이더 마크 렌더링
            renderSliderMarks('sliderMarks');
            renderSliderMarks('sliderMarksApt');
            
            // AI 데이터 분석 뷰 초기화
            loadMenuData();
            setupCardDropZones();
            updateYearRangeDisplay();
            renderPolicyTable();
            
            // AI 데이터 분석 년도 슬라이더 (시작/종료)
            const startSlider = document.getElementById('yearRangeSliderStart');
            const endSlider = document.getElementById('yearRangeSliderEnd');
            
            startSlider.addEventListener('input', function(e) {
                let startValue = parseInt(e.target.value);
                let endValue = parseInt(endSlider.value);
                
                if (startValue >= endValue) {
                    endValue = Math.min(119, startValue + 1);
                    endSlider.value = endValue;
                }
                
                state.yearRange = [startValue, endValue];
                updateYearRangeDisplay();
                updateSliderTrack(startSlider, endSlider);
            });
            
            endSlider.addEventListener('input', function(e) {
                let startValue = parseInt(startSlider.value);
                let endValue = parseInt(e.target.value);
                
                if (endValue <= startValue) {
                    startValue = Math.max(0, endValue - 1);
                    startSlider.value = startValue;
                }
                
                state.yearRange = [startValue, endValue];
                updateYearRangeDisplay();
                updateSliderTrack(startSlider, endSlider);
            });
            
            console.log('✅ 초기화 완료');
        }
        
        // DOMContentLoaded와 load 둘 다 확인
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
